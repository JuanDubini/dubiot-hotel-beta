<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <script>
    (() => {
      const { origin, pathname, search, hash } = window.location;
      if (origin !== 'https://juandubini.github.io' ||
          pathname !== '/dubiot-hotel-beta/beta.html') return;

      const target = new URL('https://hotel.dubiot.com/beta');
      const team = new URLSearchParams(search).get('equipo');
      if (team) target.searchParams.set('equipo', team);

      // Preserve the QR fragment, but never carry authentication fragments to another origin.
      if (/^#asset=[^&#]+$/.test(hash)) {
        try {
          target.hash = 'asset=' + encodeURIComponent(decodeURIComponent(hash.slice(7)));
        } catch {
          // A malformed QR fragment should still lead to the official login.
        }
      }

      window.location.replace(target.href);
    })();
  </script>
